<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work-RAG</title>
  <style>:root {
  --bg-primary: var(--color-background-primary, #ffffff);
  --bg-secondary: var(--color-background-secondary, #f5f6f8);
  --bg-tertiary: var(--color-background-tertiary, #eceef2);
  --bg-info: var(--color-background-info, #e8f1ff);
  --bg-success: var(--color-background-success, #e7f6ec);
  --bg-warning: var(--color-background-warning, #fff4e0);
  --bg-danger: var(--color-background-danger, #fdeaea);
  --text-primary: var(--color-text-primary, #1f2328);
  --text-secondary: var(--color-text-secondary, #59636e);
  --text-tertiary: var(--color-text-tertiary, #7a8491);
  --text-info: var(--color-text-info, #0969da);
  --text-success: var(--color-text-success, #1a7f37);
  --text-warning: var(--color-text-warning, #9a6700);
  --text-danger: var(--color-text-danger, #cf222e);
  --border-primary: var(--color-border-primary, #d0d7de);
  --border-secondary: var(--color-border-secondary, #e3e8ee);
  --ring-primary: var(--color-ring-primary, #0969da);
  --font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif);
}

* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: 13px;
  line-height: 1.45;
}

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 100vh;
}

.app-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border-secondary);
  background: var(--bg-secondary);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
}

.data-dir-pill {
  font-size: 11px;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  border: 1px solid var(--border-secondary);
  border-radius: 6px;
  padding: 2px 7px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stats-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.stat-chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg-primary);
  border: 1px solid var(--border-secondary);
  color: var(--text-secondary);
}

.tab-bar {
  display: flex;
  gap: 4px;
  padding: 6px 14px 0;
  border-bottom: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  overflow-x: auto;
}

.tab-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  padding: 7px 12px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}

.tab-btn:hover {
  color: var(--text-primary);
}

.tab-btn.active {
  color: var(--text-info);
  border-bottom-color: var(--ring-primary);
}

.app-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-secondary);
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card-title {
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.row {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.row-grow {
  flex: 1;
  min-width: 160px;
}

.col {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

label.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--text-secondary);
}

input[type="text"],
input[type="search"],
textarea,
select {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font: inherit;
}

input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--ring-primary);
  outline-offset: -1px;
}

button {
  appearance: none;
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
  color: var(--text-primary);
  border-radius: 6px;
  padding: 5px 10px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}

button:hover:not(:disabled) {
  background: var(--bg-tertiary);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

button.primary {
  background: var(--ring-primary);
  border-color: var(--ring-primary);
  color: #ffffff;
}

button.primary:hover:not(:disabled) {
  filter: brightness(0.92);
  background: var(--ring-primary);
}

button.danger {
  color: var(--text-danger);
  border-color: var(--text-danger);
}

.banner {
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.banner.error {
  background: var(--bg-danger);
  color: var(--text-danger);
  border: 1px solid var(--text-danger);
}

.banner.info {
  background: var(--bg-info);
  color: var(--text-info);
  border: 1px solid var(--border-secondary);
}

.banner.success {
  background: var(--bg-success);
  color: var(--text-success);
  border: 1px solid var(--border-secondary);
}

.badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
}

.badge.new { background: var(--bg-info); color: var(--text-info); }
.badge.changed { background: var(--bg-warning); color: var(--text-warning); }
.badge.missing { background: var(--bg-danger); color: var(--text-danger); }
.badge.success { background: var(--bg-success); color: var(--text-success); }

.suffix-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.suffix-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
  font-size: 11px;
  cursor: pointer;
}

.suffix-pill.selected {
  background: var(--bg-info);
  border-color: var(--ring-primary);
  color: var(--text-info);
}

.item-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.item-card {
  background: var(--bg-primary);
  border: 1px solid var(--border-secondary);
  border-radius: 6px;
  padding: 9px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--text-secondary);
  overflow-wrap: anywhere;
}

.muted {
  color: var(--text-secondary);
  font-size: 12px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  z-index: 50;
}

.modal {
  background: var(--bg-primary);
  border: 1px solid var(--border-primary);
  border-radius: 10px;
  width: min(560px, 100%);
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--bg-secondary);
}

.modal-body {
  padding: 10px 12px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.modal-footer {
  padding: 10px 12px;
  border-top: 1px solid var(--border-secondary);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--bg-secondary);
}

.dir-entry {
  text-align: left;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border: 1px solid transparent;
  background: transparent;
}

.dir-entry:hover {
  background: var(--bg-secondary);
  border-color: var(--border-secondary);
}
</style>
</head>
